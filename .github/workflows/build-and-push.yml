name: Build and Push

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # Derived, never spelled out: a fork must publish to ITS OWN namespace or the build
  # fails at push with a permission error that names a registry path the forker has
  # never heard of. `github.repository` is `owner/name`, which is exactly the GHCR
  # path, and `docker/metadata-action` lowercases it — GHCR rejects an uppercase
  # component, and the repo name here has one.
  IMAGE: ${{ github.repository }}

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Both ends of the supported range, because the failure is asymmetric and
        # silent: node strips types rather than transforming them, so a construct that
        # emits runtime code (a parameter property, an enum) type-checks fine and then
        # refuses to LOAD — per file, before a single test registers. 22.18 is the first
        # release that strips by default; 26 is what workstations have.
        node: ['22', '26']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # --ignore-scripts matches .npmrc and the Dockerfile: no dependency lifecycle
      # scripts run, in CI or anywhere else.
      - run: npm ci --ignore-scripts
      - run: npm run check
      # The failing test NAMES, as ANNOTATIONS. A job log on this repo needs admin
      # rights, so an agent with no `actions:read` cannot read why its own suite went
      # red — three of the fleet's fourteen parked questions on 2026-08-23 were a human
      # pasting one, and one of them was a flake nobody could name for two days.
      #
      # Annotations and not `$GITHUB_STEP_SUMMARY`: verified anonymously against a
      # deliberate failure (a1f53a9) that a completed Actions check-run answers with
      # `output.summary: null`, so a job summary reaches nobody through the API. The
      # annotations endpoint is public, and until now it only ever said "Process
      # completed with exit code 1".
      - id: test
        run: |
          set -o pipefail
          npm test 2>&1 | tee "${RUNNER_TEMP}/test.log"
      # Ten is GitHub's cap on error annotations per step; the counts ride in one more so
      # a lost-result rejection is never mistaken for a green run.
      - if: failure() && steps.test.outcome == 'failure'
        env:
          NODE: ${{ matrix.node }}
        run: |
          awk -v node="$NODE" '
            /^not ok [0-9]+ - / { name = substr($0, index($0, "- ") + 2); loc = ""; err = ""; block = 0; open = 1; next }
            open && /^  location: / { loc = substr($0, 14, length($0) - 14); next }
            open && /^  error: \|-/ { block = 1; next }
            open && /^  error: / { err = substr($0, 11, length($0) - 11); next }
            open && block && /^    ./ { if (err == "") { err = $0; sub(/^ +/, "", err) } next }
            open && /^  [a-z]/ { block = 0 }
            open && /^  \.\.\.$/ { print "::error::node " node ": " name " — " err " (" loc ")"; open = 0; n += 1 }
            n == 10 { exit }
          ' "${RUNNER_TEMP}/test.log"
          grep -E '^# (tests|pass|fail|cancelled) |^npm test rejected this run' "${RUNNER_TEMP}/test.log" \
            | tr '\n' ' ' | sed "s/^/::error::node $NODE: /"

  build:
    needs: check
    runs-on: ubuntu-latest
    # Images are only published from real branches. A PR from a fork must not be able
    # to push to the registry.
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE }}
          # keel in the cluster polls the `main` tag by digest and rolls the
          # Deployment when it moves.
          tags: |
            type=ref,event=branch
            type=sha,format=long

      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
